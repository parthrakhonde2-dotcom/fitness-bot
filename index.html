<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>FitCoach AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="chat-container">

        <!-- Header -->
        <div class="chat-header">

            <div>
                <h1>💪 FitCoach</h1>

                <p>
                    Your Personal Fitness Coach
                </p>
            </div>

            <button id="clearButton">
                Clear
            </button>

        </div>


        <!-- Chat Messages -->
        <div
            id="chatMessages"
            class="chat-messages"
        >

            <div class="message bot-message">

                <p>
                    👋 Hi! I'm FitCoach.
                </p>

                <p>
                    I can help you with workouts,
                    fitness goals, nutrition and
                    healthy habits.
                </p>

            </div>

        </div>


        <!-- Input Area -->
        <div class="chat-input">

            <input
                type="text"
                id="userInput"
                placeholder="Ask me about fitness..."
            >

            <button id="sendButton">
                Send
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
